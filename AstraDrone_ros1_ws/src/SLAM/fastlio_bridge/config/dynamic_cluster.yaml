odom_topic: /uav1/fastlio/odom
cluster_tolerance: 0.55
min_cluster_size: 4
max_cluster_size: 1000
track_match_distance: 0.80
near_track_match_distance: 1.00
association_position_tolerance: 0.20
near_association_position_tolerance: 0.30
max_association_speed: 3.00
horizontal_motion_only: true
velocity_history_size: 12
# 输出位置快速跟随；运动判定历史另做低通，不为显示速度放宽误检门限。
position_alpha: 0.65
motion_position_alpha: 0.20
velocity_alpha: 0.20
motion_distance_threshold: 0.20
motion_speed_threshold: 0.30
motion_history_time: 0.50
motion_linearity_threshold: 0.82
max_velocity_fit_residual: 0.10
dynamic_confirm_frames: 4
static_confirm_frames: 3
max_velocity: 3.0
max_missed_frames: 4
near_field_range: 3.0
# 近场也必须形成连续轨迹。原先 7 cm / 2 帧会把树叶扫描边缘漂移误判为人。
near_motion_history_time: 0.45
near_motion_distance_threshold: 0.18
near_motion_speed_threshold: 0.32
near_motion_linearity_threshold: 0.80
near_max_velocity_fit_residual: 0.10
near_dynamic_confirm_frames: 4
# 高置信静态地图否决：树冠、栅栏等被重复观测后不再作为动态目标。
stable_static_map_topic: /uav1/stable_static_map
static_support_radius: 0.35
static_support_ratio: 0.60
static_support_min_map_points: 30
