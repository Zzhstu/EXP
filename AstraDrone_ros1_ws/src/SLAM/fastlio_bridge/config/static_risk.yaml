# Immediate collision checks use the fresh scan. The global cloud_map publishes
# more slowly and intentionally contains old static structure.
cloud_topic: /uav1/fastlio/registered_scan
odom_topic: /uav1/fastlio/odom
dynamic_objects_topic: /uav1/semantic_dynamic_objects
world_frame: map
uav_radius: 0.35
# clearance 是从机体外缘到静态表面的距离；实际点云触发距离约为
# uav_radius + clearance。当前 level-1/level-2 约在 0.90 m / 0.65 m 触发。
safe_clearance: 0.55
emergency_clearance: 0.30
exit_clearance: 0.60
min_relative_z: -0.35
max_relative_z: 0.45
check_radius: 2.0
min_valid_distance: 0.05
support_radius: 0.30
min_support_points: 4
min_avoid_speed: 0.20
max_avoid_speed: 0.65
avoidance_alpha: 0.25
cloud_timeout: 0.30
odom_timeout: 0.30
dynamic_mask_radius: 0.60
dynamic_mask_half_height: 1.00
dynamic_mask_hold_time: 0.60
